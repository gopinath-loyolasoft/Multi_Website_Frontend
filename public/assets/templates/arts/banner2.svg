<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <linearGradient id="artsGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f2b23" />
      <stop offset="100%" stop-color="#021f18" />
    </linearGradient>
    <radialGradient id="libraryGlow" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#021f18" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="800" fill="url(#artsGrad2)" />
  <rect width="1920" height="800" fill="url(#libraryGlow)" />

  <!-- Library Shelves / Archives Silhouette -->
  <g opacity="0.15" fill="#ffffff" transform="translate(1100, 150)">
    <!-- Bookcase Frame -->
    <rect x="0" y="0" width="700" height="550" rx="8" fill="none" stroke="#fbbf24" stroke-width="4" />
    <line x1="0" y1="140" x2="700" y2="140" stroke="#fbbf24" stroke-width="3" />
    <line x1="0" y1="280" x2="700" y2="280" stroke="#fbbf24" stroke-width="3" />
    <line x1="0" y1="420" x2="700" y2="420" stroke="#fbbf24" stroke-width="3" />
    
    <!-- Shelf 1 Books -->
    <rect x="30" y="30" width="22" height="110" rx="2" />
    <rect x="56" y="20" width="28" height="120" rx="2" />
    <rect x="88" y="35" width="20" height="105" rx="2" />
    <rect x="112" y="15" width="32" height="125" rx="2" />
    <rect x="148" y="25" width="24" height="115" rx="2" />
    <rect x="176" y="40" width="18" height="100" rx="2" />
    <rect x="198" y="22" width="30" height="118" rx="2" />
    
    <!-- Shelf 2 Books -->
    <rect x="30" y="170" width="30" height="110" rx="2" />
    <rect x="64" y="160" width="20" height="120" rx="2" />
    <rect x="88" y="175" width="35" height="105" rx="2" />
    <rect x="127" y="165" width="24" height="115" rx="2" />
    <rect x="155" y="180" width="18" height="100" rx="2" />

    <!-- Heritage Microscope / Science Silhouette -->
    <circle cx="450" cy="210" r="60" fill="none" stroke="#34d399" stroke-width="3" />
    <path d="M 450 150 L 450 270 M 420 270 L 480 270 M 435 180 L 465 180" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- NAAC / Research Excellence Crest Motif -->
  <g transform="translate(1550, 200)" opacity="0.4">
    <polygon points="120,20 180,60 200,120 160,180 120,200 80,180 40,120 60,60" fill="none" stroke="url(#goldAccent)" stroke-width="3" />
    <circle cx="120" cy="110" r="45" fill="none" stroke="url(#goldAccent)" stroke-width="2" />
    <text x="120" y="116" fill="#fef08a" font-family="serif" font-size="18" font-weight="bold" text-anchor="middle">A++</text>
  </g>

  <!-- Starry / Particle Elements -->
  <circle cx="300" cy="180" r="2" fill="#fbbf24" opacity="0.6" />
  <circle cx="580" cy="240" r="3" fill="#ffffff" opacity="0.5" />
  <circle cx="820" cy="120" r="2" fill="#34d399" opacity="0.7" />
  <circle cx="950" cy="320" r="2.5" fill="#fef08a" opacity="0.6" />
  <circle cx="1250" cy="100" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="1720" cy="480" r="2" fill="#ffffff" opacity="0.6" />

  <rect y="420" width="1920" height="380" fill="url(#artsGrad2)" opacity="0.7" />
</svg>
