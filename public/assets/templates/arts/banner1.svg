<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <linearGradient id="artsGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <radialGradient id="artsGlow1" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#047857" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="800" fill="url(#artsGrad1)" />
  <rect width="1920" height="800" fill="url(#artsGlow1)" />

  <!-- Geometric Academic Grid / Patterns -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="160" x2="1920" y2="160" />
    <line x1="0" y1="320" x2="1920" y2="320" />
    <line x1="0" y1="480" x2="1920" y2="480" />
    <line x1="0" y1="640" x2="1920" y2="640" />
    <line x1="384" y1="0" x2="384" y2="800" />
    <line x1="768" y1="0" x2="768" y2="800" />
    <line x1="1152" y1="0" x2="1152" y2="800" />
    <line x1="1536" y1="0" x2="1536" y2="800" />
  </g>

  <!-- Classical Architectural Columns & Pediment Silhouette on Right Side -->
  <g opacity="0.2" fill="#ffffff" transform="translate(1250, 100)">
    <!-- Triangular Pediment -->
    <polygon points="300,50 50,160 550,160" />
    <rect x="30" y="160" width="540" height="24" rx="4" />
    <!-- Columns -->
    <rect x="70" y="184" width="40" height="420" rx="3" />
    <rect x="170" y="184" width="40" height="420" rx="3" />
    <rect x="270" y="184" width="40" height="420" rx="3" />
    <rect x="370" y="184" width="40" height="420" rx="3" />
    <rect x="470" y="184" width="40" height="420" rx="3" />
    <!-- Base -->
    <rect x="20" y="604" width="560" height="30" rx="4" />
  </g>

  <!-- Floating Academic Symbols: Open Book & Laurels -->
  <g transform="translate(1450, 420)" opacity="0.35">
    <circle cx="100" cy="100" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="12 6" />
    <!-- Stylized Book -->
    <path d="M 60 80 Q 100 95 100 130 Q 100 95 140 80 L 140 125 Q 100 140 100 175 Q 100 140 60 125 Z" fill="#fbbf24" />
    <!-- Feather Quill -->
    <path d="M 125 50 Q 150 90 120 140 L 110 135 Q 130 90 125 50 Z" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Ambient Light Bokeh Circles -->
  <circle cx="450" cy="200" r="180" fill="#34d399" opacity="0.08" filter="blur(40px)" />
  <circle cx="1650" cy="300" r="220" fill="#fbbf24" opacity="0.12" filter="blur(50px)" />
  <circle cx="1100" cy="650" r="150" fill="#10b981" opacity="0.1" filter="blur(35px)" />

  <!-- Subtle Bottom Gradient Vignette for Text Legibility -->
  <rect y="400" width="1920" height="400" fill="url(#artsGrad1)" opacity="0.6" />
</svg>
