<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="portraitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="stoleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#portraitBg)" />
  
  <!-- Subtle Crest Ring in Background -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" />
  
  <!-- Silhouette of Academic Leader with Robes & Stole -->
  <g transform="translate(0, 10)">
    <!-- Head -->
    <circle cx="200" cy="130" r="55" fill="#e2e8f0" />
    <!-- Shoulders & Academic Gown -->
    <path d="M 90 350 C 90 230 140 210 200 210 C 260 210 310 230 310 350 Z" fill="#334155" />
    <!-- Golden Academic Stole -->
    <path d="M 160 210 L 150 350 L 175 350 L 180 230 Z" fill="url(#stoleGrad)" />
    <path d="M 240 210 L 250 350 L 225 350 L 220 230 Z" fill="url(#stoleGrad)" />
    <!-- Collar & Tie Accent -->
    <polygon points="190,210 210,210 200,245" fill="#f8fafc" />
    <polygon points="196,245 204,245 202,280 198,280" fill="#dc2626" />
  </g>

  <!-- Laurel Wreath at bottom -->
  <g opacity="0.4" stroke="#fbbf24" stroke-width="2" fill="none">
    <path d="M 120 370 Q 200 395 280 370" />
  </g>
</svg>
