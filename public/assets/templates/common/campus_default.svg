<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="campusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#campusBg)" />

  <!-- Campus Facade Silhouette -->
  <g opacity="0.3" fill="#64748b" transform="translate(100, 200)">
    <!-- Main Center Building with Clocktower -->
    <rect x="400" y="100" width="200" height="400" rx="4" />
    <!-- Tower Pyramid -->
    <polygon points="500,0 420,100 580,100" fill="#94a3b8" />
    <!-- Clock -->
    <circle cx="500" cy="160" r="28" fill="#f8fafc" />
    <circle cx="500" cy="160" r="24" fill="#0f172a" />
    <line x1="500" y1="160" x2="500" y2="144" stroke="#fbbf24" stroke-width="3" />
    <line x1="500" y1="160" x2="512" y2="160" stroke="#fbbf24" stroke-width="3" />

    <!-- Left Wing -->
    <rect x="100" y="220" width="300" height="280" rx="4" />
    <!-- Right Wing -->
    <rect x="600" y="220" width="300" height="280" rx="4" />
  </g>

  <!-- Trees along walkway -->
  <g opacity="0.4" fill="#10b981">
    <circle cx="200" cy="650" r="60" />
    <circle cx="350" cy="670" r="50" />
    <circle cx="850" cy="670" r="50" />
    <circle cx="1000" cy="650" r="60" />
  </g>

  <!-- Title / Emblem -->
  <g transform="translate(600, 680)" opacity="0.6">
    <text x="0" y="0" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="4">CAMPUS PREMISES</text>
  </g>
</svg>
