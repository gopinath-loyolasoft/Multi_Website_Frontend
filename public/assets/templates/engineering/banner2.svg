  </defs>

  <rect width="1920" height="800" fill="url(#engGrad2)" />
  <rect width="1920" height="800" fill="url(#indigoGlow)" />

  <!-- Neural Network & Quantum Dot Mesh -->
  <g opacity="0.3" stroke="#818cf8" stroke-width="1.5">
