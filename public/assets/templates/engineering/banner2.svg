    <line x1="1350" y1="150" x2="1420" y2="340" />
    <line x1="1500" y1="220" x2="1580" y2="380" />
    <line x1="1420" y1="340" x2="1580" y2="380" />
    <line x1="1200" y1="200" x2="1280" y2="380" />
    <line x1="1280" y1="380" x2="1420" y2="340" />
    <line x1="1580" y1="380" x2="1750" y2="320" />
    <line x1="1680" y1="160" x2="1750" y2="320" />
    <line x1="1420" y1="340" x2="1500" y2="520" />
