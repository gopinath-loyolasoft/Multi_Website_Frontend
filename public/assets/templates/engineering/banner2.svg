  <!-- Modern Tech Tower / Campus Antenna Silhouette -->
  <g transform="translate(1620, 120)" opacity="0.25">
    <path d="M 80 0 L 110 380 L 50 380 Z" fill="#60a5fa" />
    <circle cx="80" cy="20" r="25" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="80" cy="20" r="45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="80" cy="20" r="6" fill="#f59e0b" />
