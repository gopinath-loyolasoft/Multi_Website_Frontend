    <!-- Nodes -->
    <circle cx="1200" cy="200" r="7" fill="#38bdf8" />
    <circle cx="1350" cy="150" r="9" fill="#818cf8" />
    <circle cx="1500" cy="220" r="11" fill="#f59e0b" />
    <circle cx="1680" cy="160" r="8" fill="#38bdf8" />
    <circle cx="1280" cy="380" r="6" fill="#818cf8" />
    <circle cx="1420" cy="340" r="10" fill="#60a5fa" />
